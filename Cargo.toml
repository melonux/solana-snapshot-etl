[package]
name = "solana-snapshot-etl"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
documentation = "https://docs.rs/solana-snapshot-etl"
description = "Efficiently unpack Solana snapshots"
authors = ["Richard Patel <me@terorie.dev>"]
categories = ["cryptography::cryptocurrencies", "database"]
keywords = ["solana"]

[dependencies]
clap = { version = "3.2.14", features = ["derive"] }
log = "0.4.17"
solana-runtime = "1.11.3"
thiserror = "1.0.31"
bincode = "1.3.3"
serde = { version = "1.0.139", features = ["derive"] }
solana-sdk = "1.11.3"
memmap2 = "0.5.5"
itertools = "0.10.3"
tar = "0.4.38"
zstd = "0.11.2"
wasm-bindgen = "0.2.88"

# Binary deps
borsh = { version = "0.9.3", optional = true }
crossbeam = { version = "0.8.2", optional = true }
csv = { version = "1.1.6", optional = true }
clickhouse = { version = "0.15.1", features = ["inserter"], optional = true }
dotenvy = { version = "0.15.7", optional = true }
env_logger = { version = "0.9.0", optional = true }
indicatif = { version = "0.17.0-rc.11", optional = true }
percent-encoding = { version = "2.1.0", optional = true }
solana-program = { version = "1.11.3", optional = true }
solana_rbpf = { version = "0.2.31", optional = true }
spl-token = { version = "3.3.0", optional = true }
spl-token-2022 = { version = "0.3.0", optional = true }
url = { version = "2.2.2", optional = true }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "time"], optional = true }

[features]
standalone = [
    "borsh",
    "clickhouse",
    "crossbeam",
    "csv",
    "dotenvy",
    "env_logger",
    "indicatif",
    "percent-encoding",
    "solana-program",
    "spl-token",
    "spl-token-2022",
    "url",
    "tokio",
]
opcode_stats = [
    "solana_rbpf",
]

[[bin]]
name = "solana-snapshot-etl"
required-features = ["standalone"]

[[bin]]
name = "solana-opcode-stats"
required-features = ["opcode_stats"]

[[bin]]
name = "import_hot_token"
path = "src/bin/import_hot_token/main.rs"
required-features = ["standalone"]
